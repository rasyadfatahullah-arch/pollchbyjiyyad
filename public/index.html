<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JIYYAD TOOLS — Vote Channel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0f14;
      --surface: #121820;
      --surface-2: #1a2330;
      --border: #243044;
      --text: #e8eef7;
      --muted: #8b9bb4;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --error: #ef4444;
      --warning: #f59e0b;
      --radius: 14px;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(59, 130, 246, 0.18), transparent),
        radial-gradient(ellipse 60% 40% at 90% 100%, rgba(34, 197, 94, 0.08), transparent);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .header {
      padding: 28px 28px 20px;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 18px;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
    }

    .logo h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 0.875rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .body {
      padding: 24px 28px 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 8px;
      letter-spacing: 0.01em;
    }

    input, textarea {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9375rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    input::placeholder, textarea::placeholder {
      color: #5a6a82;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .btn {
      width: 100%;
      margin-top: 8px;
      padding: 13px 20px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
    }

    .btn:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.45);
    }

    .btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .btn .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    .btn.loading .spinner { display: block; }
    .btn.loading .btn-text { display: none; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .terminal-wrap {
      margin-top: 22px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #0a0e13;
      opacity: 0;
      max-height: 0;
      transition: opacity 0.35s ease, max-height 0.4s ease, margin 0.3s ease;
    }

    .terminal-wrap.show {
      opacity: 1;
      max-height: 420px;
      margin-top: 22px;
    }

    .terminal-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: #0f141b;
      border-bottom: 1px solid var(--border);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .dot.r { background: #ff5f56; }
    .dot.y { background: #ffbd2e; }
    .dot.g { background: #27c93f; }

    .terminal-title {
      font-size: 0.75rem;
      color: var(--muted);
      margin-left: 6px;
      font-family: 'JetBrains Mono', monospace;
    }

    .terminal-body {
      padding: 14px 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8125rem;
      line-height: 1.65;
      max-height: 280px;
      overflow-y: auto;
      color: #a8b8d0;
    }

    .terminal-body::-webkit-scrollbar { width: 6px; }
    .terminal-body::-webkit-scrollbar-track { background: transparent; }
    .terminal-body::-webkit-scrollbar-thumb {
      background: #2a3548;
      border-radius: 3px;
    }

    .line {
      margin-bottom: 2px;
      animation: typeIn 0.25s ease both;
    }

    @keyframes typeIn {
      from { opacity: 0; transform: translateX(-6px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .line .prompt { color: #3b82f6; }
    .line .success { color: var(--success); }
    .line .error { color: var(--error); }
    .line .warn { color: var(--warning); }
    .line .info { color: #60a5fa; }
    .line .muted { color: #5a6a82; }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.75rem;
      color: var(--muted);
      animation: fadeUp 0.6s 0.15s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .footer span { color: #64748b; }

    .secure-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      font-size: 0.7rem;
      color: var(--success);
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.25);
      padding: 4px 10px;
      border-radius: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <div class="logo">
          <div class="logo-icon">⚡</div>
          <h1>JIYYAD TOOLS</h1>
        </div>
        <p class="subtitle">WhatsApp Channel Vote</p>
        <div class="secure-badge">🔒 Secure Proxy Mode</div>
      </div>

      <div class="body">
        <form id="voteForm" autocomplete="off">
          <div class="form-group">
            <label for="url">URL Channel / Post</label>
            <input
              type="url"
              id="url"
              placeholder="https://whatsapp.com/channel/..."
              required
            />
          </div>

          <div class="form-group">
            <label for="pesan">Pesan Vote</label>
            <textarea
              id="pesan"
              placeholder="Contoh: upp / vote / support"
              required
            ></textarea>
          </div>

          <button type="submit" class="btn" id="submitBtn">
            <span class="btn-text">Kirim Vote</span>
            <span class="spinner"></span>
          </button>
        </form>

        <div class="terminal-wrap" id="terminalWrap">
          <div class="terminal-header">
            <div class="dot r"></div>
            <div class="dot y"></div>
            <div class="dot g"></div>
            <span class="terminal-title">output — vote process</span>
          </div>
          <div class="terminal-body" id="terminal"></div>
        </div>
      </div>
    </div>

    <p class="footer">
      Powered by <strong>JIYYAD TOOLS</strong> · <span>Secure & Smooth</span>
    </p>
  </div>

  <script>
    const form = document.getElementById('voteForm');
    const terminalWrap = document.getElementById('terminalWrap');
    const terminal = document.getElementById('terminal');
    const submitBtn = document.getElementById('submitBtn');

    // Frontend hanya memanggil endpoint lokal (API key tidak ada di sini)
    const PROXY_ENDPOINT = '/api/vote';

    function addLine(html, delay = 0) {
      return new Promise(resolve => {
        setTimeout(() => {
          const div = document.createElement('div');
          div.className = 'line';
          div.innerHTML = html;
          terminal.appendChild(div);
          terminal.scrollTop = terminal.scrollHeight;
          resolve();
        }, delay);
      });
    }

    function clearTerminal() {
      terminal.innerHTML = '';
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const url = document.getElementById('url').value.trim();
      const pesan = document.getElementById('pesan').value.trim();

      if (!url || !pesan) return;

      submitBtn.disabled = true;
      submitBtn.classList.add('loading');
      terminalWrap.classList.add('show');
      clearTerminal();

      await addLine(`<span class="prompt">$</span> <span class="muted">connecting via secure proxy...</span>`, 80);
      await addLine(`<span class="info">→</span> target: <span class="muted">${escapeHtml(url)}</span>`, 180);
      await addLine(`<span class="info">→</span> pesan: <span class="muted">"${escapeHtml(pesan)}"</span>`, 110);
      await addLine(`<span class="prompt">$</span> <span class="muted">sending request...</span>`, 150);

      try {
        const res = await fetch(PROXY_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, pesan })
        });

        const data = await res.json();

        if (data.status === true && data.result) {
          const r = data.result;
          await addLine(`<span class="success">✓</span> request accepted`, 90);
          await addLine(`<span class="muted">─────────────────────────────</span>`, 70);
          await addLine(`<span class="info">channel</span>  : ${escapeHtml(r.channel || '-')}`, 50);
          await addLine(`<span class="info">post</span>     : ${escapeHtml(String(r.post || '-'))}`, 45);
          await addLine(`<span class="info">total</span>    : ${r.total ?? '-'}`, 45);
          await addLine(`<span class="success">success</span>  : ${r.success ?? 0}`, 45);
          await addLine(`<span class="error">failed</span>   : ${r.failed ?? 0}`, 45);
          await addLine(`<span class="muted">─────────────────────────────</span>`, 55);
          await addLine(`<span class="success">✓ ${escapeHtml(r.message || 'Vote berhasil diproses')}</span>`, 70);
        } else {
          await addLine(`<span class="error">✗</span> <span class="error">${escapeHtml(data.message || 'gagal memproses vote')}</span>`, 90);
          if (data.error) {
            await addLine(`<span class="muted">${escapeHtml(data.error)}</span>`, 80);
          }
        }
      } catch (err) {
        await addLine(`<span class="error">✗ network / proxy error</span>`, 90);
        await addLine(`<span class="error">${escapeHtml(err.message)}</span>`, 70);
        await addLine(`<span class="warn">⚠ Pastikan server sudah dijalankan (npm start)</span>`, 80);
      } finally {
        submitBtn.disabled = false;
        submitBtn.classList.remove('loading');
      }
    });
  </script>
</body>
          </html>
